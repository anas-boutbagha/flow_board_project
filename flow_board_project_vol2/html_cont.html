<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/main.js" type="module"></script>
    <link rel="stylesheet" href="./adding.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header class="h-24 flex justify-between border-3 border-cyan-700 ">
        <div class=" ml-2">
            <p class=" text-[25px] text-cyan-900 font-bold mt-4">[FlowBoard]</p>
        </div>
        <div class="mt-1 mr-2.5">
            <button
                class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl border-cyan-700 text-cyan-500 text-[16px] font-medium h-10 w-full">AI
                Generation</button>
            <fieldset class="fieldset w-full">
                <select class="text-cyan-500 text-[16px] font-medium select select_uu border-cyan-700">
                    <option disabled selected>choose a filter </option>
                    <option class="text-cyan-950">priority</option>
                    <option class="text-cyan-950">assignee</option>
                    <option class="text-cyan-950">q</option>
                </select>
            </fieldset>
        </div>
    </header>
    <div>

    </div>
    <main class="flex flex-wrap z-0">
        <section class="todo w-1/3 flex flex-col border-2 border-cyan-500">
            <div id="id" class="w-full border-2 border-cyan-500 rounded-b-xl">
                <div class="w-full flex justify-between">
                    <p class="m-1.5">titre</p>
                    <img class="delete " src="./ressources/delete_img.jpg" alt="delete_img">
                </div>
                <div class="w-full flex flex-col ">
                    <p>date</p>
                    <p class="mt-1.5">assignee</p>
                    <p class="mt-1.5">discription</p>
                </div>
                <div class="w-full flex flex-col">
                    <div class="tags_div mt-1.5">

                    </div>
                    <div class="mt-3.5 flex justify-between">
                        <span class=" p-2 pb-2.5 bg-red-800 border-2 border-cyan-700 rounded-4xl">priority</span><button
                            class="btn btn-active btn-xs btn-success sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl">modifier</button>
                    </div>
                </div>
            </div>
        </section>
        <section class="in_progress w-1/3 flex flex-col border-2 border-cyan-500">

        </section>
        <section class="done w-1/3 flex flex-col border-2 border-cyan-500">

        </section>
    </main>
    <footer></footer>
</body>

</html>
